spring.application.name=product-service

server.port=8080

server.servlet.context-path=/product

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/microservices
spring.datasource.username=root
spring.datasource.password=root

inventory.service.url=http://inventory-service/inventory/

logging.file.name=C:/java_logs/microservices/product-service/product-service.log

# Spring Security JWT
security.jwt.secret-key=ef09c6530bab2850ad03e20d3710b0560c742f4e29d73b2fe247d0b97020565e

# Auth Service URL (Eureka service name + context path)
auth.service.url=http://auth-jwt-service/auth/

# Product Service credentials
security.service.client-id=product-service
security.service.client-secret=${PRODUCT_SERVICE_CLIENT_SECRET}

# Cache service token for 14 minutes (token expires in 15 minutes)
security.service.token-cache-duration=840000
