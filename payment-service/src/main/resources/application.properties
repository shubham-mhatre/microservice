spring.application.name=payment-service

server.port=8085

server.servlet.context-path=/payment

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/microservices
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update

logging.file.name=C:/java_logs/microservices/payment-service/payment-service.log

order.service.url=http://order-service/order/

# Spring Security JWT
security.jwt.secret-key=ef09c6530bab2850ad03e20d3710b0560c742f4e29d73b2fe247d0b97020565e

# Auth Service
auth.service.url=http://auth-jwt-service/auth/

# Service credentials
security.service.client-id=payment-service
security.service.client-secret=${PAYMENT_SERVICE_CLIENT_SECRET}

# Token cache - 14 minutes
security.service.token-cache-duration=840000

logging.level.org.springframework.security=TRACE
logging.level.org.springframework.security.oauth2=DEBUG