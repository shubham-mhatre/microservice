spring.application.name=order-service

server.port=8081

server.servlet.context-path=/order

eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/microservices
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update

inventory.service.url=http://inventory-service/inventory/
product.service.url=http://product-service/product/

logging.file.name=C:/java_logs/microservices/order-service/order-service.log